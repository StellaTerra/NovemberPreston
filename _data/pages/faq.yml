  twitter_description: Read common questions about telehealth, ecotherapy, sliding scale availability, and out-of-network superbills.
hero:
  title_id: faq-title
  eyebrow: Frequently asked questions
  title: Therapy FAQ for California and Oregon Clients
  body: Questions below cover logistics, fees, and session format. If you need anything else, you can [reach out directly](../contact/) before scheduling.
faq:
  title_id: faq-list-title
  title: Common questions and answers
  items:
    - question: How can we meet for sessions?
      answer: In office sessions are available on Tuesdays.
      Telehealth is available statewide in California and Oregon by secure video. 
      Ecotherapy sessions in East Bay settings are available after initial sessions, and can be integrated regularly or as needed. Review [East Bay ecotherapy session details](../ecotherapy/) for what to expect.
    - question: What are your rates?
      answer:  I use a three-tier fee system designed to make lower-fee therapy available while supporting a sustainable practice:

Community Care Fee: $110
Sustainable Fee: $220
Solidarity Fee: $330

If you are unsure which tier fits your circumstances, we can discuss it during your consultation. 
    - question: Do you offer lower-fee sessions?
      answer: Yes. A limited number of Community Care appointments are available at $110 through my three-tier fee system.
    - question: Do you take insurance?
      answer: Insurance is not billed directly. A superbill can be provided for out-of-network reimbursement. Please check your specific mental health benefits with your plan.
    - question: Where are you located?
      answer: The practice is based in the East Bay of the San Francisco Bay Area. 
      In person sessions happen in the Oakland Chinatown District, about 5 minutes walk from Lake Merritt BART
      Telehealth is available statewide in California and Oregon 
      Ecotherapy sessions offered in several outdoor East Bay locations
cta:
